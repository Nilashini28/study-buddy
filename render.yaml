services:
  - type: web
    name: study-buddy-backend
    env: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Add your other environment variables (MONGO_URI, GROQ_API_KEY, etc.) in the Render Dashboard
