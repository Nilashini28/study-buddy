services:
  - type: web
    name: study-buddy-backend
    env: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Add your MONGO_URI, GROQ_API_KEY, PINECONE_API_KEY, etc. in the Render Dashboard

  - type: web
    name: study-buddy-frontend
    env: python
    buildCommand: pip install -r client/requirements.txt
    startCommand: streamlit run client/main.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BACKEND_URL
        value: https://study-buddy-backend.onrender.com
